<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>學生行為記錄器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#1a1a2e;--paper:#f5f0e8;--cream:#ede8dc;
  --red:#c0392b;--blue:#2980b9;--green:#27ae60;
  --border:#b8b0a0;--card:#fdfaf4;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:60px;}

/* header */
header{background:var(--ink);color:var(--paper);padding:14px 16px;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--red);display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--red);}
h1{font-size:17px;font-weight:900;margin-top:2px;}
.hright{text-align:right;font-family:'Space Mono',monospace;}
.hwd{font-size:20px;font-weight:700;color:var(--red);line-height:1;}
.hdt{font-size:10px;color:#aaa;}

/* tabs */
.tabs{display:flex;background:var(--cream);border-bottom:2px solid var(--border);}
.tab{flex:1;padding:11px 2px;text-align:center;font-size:12px;font-weight:500;color:#888;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;}
.tab.active{color:var(--ink);border-bottom-color:var(--red);background:var(--paper);font-weight:700;}

/* sections */
.sec{display:none;padding:14px;}
.sec.show{display:block;}

/* card */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.08);}
.ctitle{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin-bottom:12px;}

/* student grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.scard{position:relative;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 5px 8px;text-align:center;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.07);}
.scard:active{opacity:0.7;}
.sno{position:absolute;top:4px;left:6px;font-family:'Space Mono',monospace;font-size:8px;color:#ccc;}
.sdot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;}
.sname{font-size:13px;font-weight:700;margin-top:4px;line-height:1.2;}
.scnt{display:inline-block;margin-top:5px;font-size:10px;font-family:'Space Mono',monospace;padding:1px 6px;border-radius:8px;background:var(--cream);color:#aaa;}
.scard.hasneg{border-color:#e8a89f;} .scard.hasneg .sdot{background:var(--red);}
.scard.haspos{border-color:#a9dfbf;} .scard.haspos .sdot{background:var(--green);}
.scard.haspos .scnt{background:#eafaf1;color:var(--green);}
.scard.hasneg .scnt{background:#fdf0ed;color:var(--red);}

/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;align-items:flex-end;}
.overlay.show{display:flex;}
.modal{background:var(--paper);border-radius:18px 18px 0 0;padding:20px 16px 40px;width:100%;max-height:85vh;overflow-y:auto;}
.drag{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 16px;}
.mstudent{font-size:22px;font-weight:900;margin-bottom:2px;}
.mno{font-size:12px;color:#aaa;margin-bottom:16px;}
.mlabel{font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:#999;margin-bottom:6px;}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.tag{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;}
.tag.pos{background:#eafaf1;color:var(--green);border-color:#a9dfbf;}
.tag.neg{background:#fdf0ed;color:var(--red);border-color:#f5c6bb;}
.tag.neu{background:#eaf4fb;color:var(--blue);border-color:#aed6f1;}
.tag.sel.pos{background:#a9dfbf;}
.tag.sel.neg{background:#f5c6bb;}
.tag.sel.neu{background:#aed6f1;}
textarea{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Noto Sans TC',sans-serif;font-size:14px;resize:vertical;min-height:65px;margin-bottom:12px;background:#fff;}
textarea:focus{outline:none;border-color:var(--blue);}
input[type=datetime-local],input[type=text],select{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Noto Sans TC',sans-serif;font-size:14px;background:#fff;margin-bottom:10px;}
input:focus,select:focus{outline:none;border-color:var(--blue);}
.wdshow{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--blue);margin:-4px 0 12px;}

/* buttons */
.btn{display:block;width:100%;padding:13px;border:none;border-radius:9px;font-size:15px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;text-align:center;}
.btn:active{opacity:0.8;}
.btn-dark{background:var(--ink);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:#666;}
.btn-sm{width:auto;display:inline-block;padding:7px 14px;font-size:12px;border-radius:7px;}
.btnrow{display:flex;gap:8px;margin-top:8px;}
.btnrow .btn{flex:1;}

/* records */
.rcard{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:11px 12px;margin-bottom:8px;position:relative;}
.rcard.pos{border-left-color:var(--green);}
.rcard.neg{border-left-color:var(--red);}
.rcard.neu{border-left-color:var(--blue);}
.rmeta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;}
.rname{font-weight:700;font-size:14px;}
.rtime{font-size:10px;color:#aaa;font-family:'Space Mono',monospace;text-align:right;white-space:pre-line;}
.rtags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;}
.rtag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.rtag.pos{background:#eafaf1;color:var(--green);}
.rtag.neg{background:#fdf0ed;color:var(--red);}
.rtag.neu{background:#eaf4fb;color:var(--blue);}
.rnote{font-size:12px;color:#666;line-height:1.5;}
.rdel{position:absolute;top:8px;right:8px;background:none;border:none;font-size:16px;color:#ddd;cursor:pointer;padding:2px 6px;}
.rdel:active{color:var(--red);}
.dgroup{font-family:'Space Mono',monospace;font-size:10px;color:#aaa;letter-spacing:1px;padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:8px;}

/* stats */
.statrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--cream);font-size:13px;}
.statrow:last-child{border-bottom:none;}
.statval{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;}
.g{color:var(--green);}.r{color:var(--red);}.b{color:var(--blue);}
.barwrap{background:#e5e0d8;border-radius:4px;height:6px;margin-top:3px;}
.bar{height:6px;border-radius:4px;transition:width 0.3s;}

/* manage rows */
.mngrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--cream);}
.mngrow:last-child{border-bottom:none;}

/* filter */
.frow{display:flex;gap:8px;margin-bottom:10px;}
.frow select{flex:1;margin-bottom:0;}

/* empty */
.empty{text-align:center;padding:48px 20px;color:#ccc;font-size:13px;}
.emptyicon{font-size:40px;margin-bottom:10px;}

/* toast */
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity 0.25s;}
#toast.show{opacity:1;}

.hint{font-size:12px;color:#999;line-height:1.6;margin-bottom:12px;}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">EDULOG</div>
    <h1>學生行為記錄器</h1>
  </div>
  <div class="hright">
    <div class="hwd" id="hwd"></div>
    <div class="hdt" id="hdt"></div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="t-home">🏠 學生</button>
  <button class="tab" id="t-list">📄 紀錄</button>
  <button class="tab" id="t-stats">📊 統整</button>
  <button class="tab" id="t-settings">⚙️ 設定</button>
</div>

<!-- HOME -->
<div class="sec show" id="s-home">
  <div class="card" style="padding:12px 14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="ctitle" style="margin-bottom:0;">學生列表</div>
      <div id="todaycnt" style="font-size:11px;color:#aaa;font-family:'Space Mono',monospace;"></div>
    </div>
    <button class="btn btn-outline" id="btnBatch" style="margin-top:10px;font-size:13px;padding:9px;">⚡ 批次輸入</button>
  </div>
  <div class="grid" id="sgrid"></div>
</div>

<!-- LIST -->
<div class="sec" id="s-list">
  <div class="card" style="padding:12px;">
    <div class="frow">
      <select id="fstu"></select>
      <select id="ftype">
        <option value="">所有類型</option>
        <option value="pos">✅ 正向</option>
        <option value="neg">⚠️ 負向</option>
        <option value="neu">📌 中性</option>
      </select>
    </div>
    <button class="btn btn-green btn-sm" id="btnExcel">⬇ 匯出 CSV（Excel可開）</button>
  </div>
  <div id="rlist"></div>
</div>

<!-- STATS -->
<div class="sec" id="s-stats">
  <div class="card"><div class="ctitle">📊 整體概覽</div><div id="ovStats"></div></div>
  <div class="card">
    <div class="ctitle">👤 學生個別</div>
    <select id="ststu" style="margin-bottom:12px;"></select>
    <div id="stStats"></div>
  </div>
  <div class="card"><div class="ctitle">🏷 標籤排行</div><div id="tagStats"></div></div>
</div>

<!-- SETTINGS -->
<div class="sec" id="s-settings">
  <div class="card">
    <div class="ctitle">☁️ 備份 / 還原</div>
    <div class="hint">點下方按鈕下載備份檔，並上傳至 Gmail 或 Google Drive 保存。還原時選擇備份的 JSON 檔。</div>
    <button class="btn btn-green" id="btnBackup" style="margin-bottom:8px;">📧 備份並開啟 Gmail</button>
    <label class="btn btn-outline" style="cursor:pointer;margin-bottom:4px;">
      ⬆ 還原備份
      <input type="file" id="fileRestore" accept=".json" style="display:none;">
    </label>
    <div id="lastbackup" style="text-align:center;font-size:11px;color:#aaa;margin-top:6px;font-family:'Space Mono',monospace;"></div>
  </div>

  <div class="card">
    <div class="ctitle">👨‍🎓 學生名單</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input type="text" id="newstu" placeholder="新增學生姓名" style="margin-bottom:0;flex:1;">
      <button class="btn btn-dark btn-sm" id="btnAddStu">新增</button>
    </div>
    <div id="stulist"></div>
  </div>

  <div class="card">
    <div class="ctitle">🏷 行為標籤</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;">
      <input type="text" id="newtag" placeholder="標籤名稱" style="margin-bottom:0;flex:1;">
      <select id="newtagtype" style="margin-bottom:0;width:86px;">
        <option value="pos">✅ 正向</option>
        <option value="neg">⚠️ 負向</option>
        <option value="neu">📌 中性</option>
      </select>
      <button class="btn btn-dark btn-sm" id="btnAddTag">新增</button>
    </div>
    <div id="taglist"></div>
  </div>

  <div class="card">
    <div class="ctitle">🗑 資料管理</div>
    <button class="btn btn-red" id="btnClear">清除所有記錄</button>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="drag"></div>
    <div class="mstudent" id="mname"></div>
    <div class="mno" id="mno"></div>
    <div class="mlabel">行為標籤（可複選）</div>
    <div class="tagrow" id="mtags"></div>
    <div class="mlabel">補充說明</div>
    <textarea id="mnote" placeholder="描述具體情況…"></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div class="mlabel" style="margin-bottom:0;">日期時間</div>
      <div class="wdshow" id="mwd"></div>
    </div>
    <input type="datetime-local" id="mdate">
    <div class="btnrow">
      <button class="btn btn-outline" id="btnCancel">取消</button>
      <button class="btn btn-dark" id="btnSave">儲存記錄</button>
    </div>

    <!-- Student history -->
    <div id="mHistory" style="margin-top:20px;"></div>
  </div>
</div>


<!-- EDIT MODAL -->
<div class="overlay" id="editOverlay">
  <div class="modal" id="editModal">
    <div class="drag"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <div class="mstudent" id="editName"></div>
      <div style="font-size:11px;color:#aaa;font-family:'Space Mono',monospace;">✏️ 修改記錄</div>
    </div>
    <div class="mno" id="editNo"></div>
    <div class="mlabel">行為標籤（可複選）</div>
    <div class="tagrow" id="editTags"></div>
    <div class="mlabel">補充說明</div>
    <textarea id="editNote" placeholder="描述具體情況…"></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div class="mlabel" style="margin-bottom:0;">日期時間</div>
      <div class="wdshow" id="editWd"></div>
    </div>
    <input type="datetime-local" id="editDate">
    <div class="btnrow">
      <button class="btn btn-outline" id="btnEditCancel">取消</button>
      <button class="btn btn-dark" id="btnEditSave">儲存修改</button>
    </div>
  </div>
</div>

<!-- BATCH MODAL -->
<div class="overlay" id="batchOverlay">
  <div class="modal">
    <div class="drag"></div>
    <div class="mstudent">⚡ 批次輸入</div>
    <div class="mno" style="margin-bottom:16px;">同一件事，快速記錄多位學生</div>

    <div class="mlabel">輸入描述（可包含座號）</div>
    <textarea id="batchInput" placeholder="例如：英文課聊天，1，5，20號&#10;或：違反紀律 3 8 15" style="min-height:80px;"></textarea>

    <div class="mlabel">解析到的學生</div>
    <div id="batchParsed" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:32px;"></div>

    <div class="mlabel">行為標籤（可複選）</div>
    <div class="tagrow" id="batchTags"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div class="mlabel" style="margin-bottom:0;">日期時間</div>
      <div class="wdshow" id="batchWd"></div>
    </div>
    <input type="datetime-local" id="batchDate">

    <div class="btnrow">
      <button class="btn btn-outline" id="btnBatchCancel">取消</button>
      <button class="btn btn-dark" id="btnBatchSave">批次儲存</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// ═══════════════════════════════
// DATA
// ═══════════════════════════════
var WD = ['日','一','二','三','四','五','六'];

var CLASS_LIST = [
  {num:1,name:'吳品樺'},{num:2,name:'林沛盈'},{num:3,name:'林采蒨'},
  {num:4,name:'林韋婷'},{num:5,name:'林筱芸'},{num:6,name:'施樂恩'},
  {num:7,name:'張育瑄'},{num:8,name:'梁恩綺'},{num:9,name:'陳思安'},
  {num:10,name:'陳昱暄'},{num:11,name:'潘羽庭'},{num:12,name:'羅書沛'},
  {num:13,name:'何承恩'},{num:14,name:'吳梓豪'},{num:15,name:'吳愷祐'},
  {num:16,name:'徐偉恒'},{num:18,name:'張凱翔'},{num:19,name:'張竣皓'},
  {num:20,name:'陳以叡'},{num:21,name:'陳羽杰'},{num:22,name:'陳言晉'},
  {num:23,name:'陳銘堃'},{num:24,name:'楊謹銘'},{num:25,name:'詹易霆'},
  {num:26,name:'潘昭瑜'},{num:27,name:'鄭運謙'}
];

var DEFAULT_TAGS = [
  {id:'t1',name:'積極參與',type:'pos'},{id:'t2',name:'主動發言',type:'pos'},
  {id:'t3',name:'樂於助人',type:'pos'},{id:'t4',name:'優秀作業',type:'pos'},
  {id:'t5',name:'違反紀律',type:'neg'},{id:'t6',name:'課堂干擾',type:'neg'},
  {id:'t7',name:'未完成作業',type:'neg'},{id:'t8',name:'遲到',type:'neg'},
  {id:'t9',name:'出席',type:'neu'},{id:'t10',name:'病假',type:'neu'},
  {id:'t11',name:'請假',type:'neu'}
];

// Load from localStorage, fallback to defaults
function loadData(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch(e) {}
  return fallback;
}
function saveData(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

var students = loadData('edu_students', CLASS_LIST);
var tags     = loadData('edu_tags', DEFAULT_TAGS);
var records  = loadData('edu_records', []);

// Persist defaults immediately
saveData('edu_students', students);
saveData('edu_tags', tags);
saveData('edu_records', records);

// ═══════════════════════════════
// HEADER
// ═══════════════════════════════
(function() {
  var n = new Date();
  document.getElementById('hwd').textContent = '週' + WD[n.getDay()];
  document.getElementById('hdt').textContent = n.toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'});
})();

// ═══════════════════════════════
// TABS
// ═══════════════════════════════
var TABS = ['home','list','stats','settings'];
function goTab(id) {
  TABS.forEach(function(t) {
    document.getElementById('s-'+t).classList.remove('show');
    document.getElementById('t-'+t).classList.remove('active');
  });
  document.getElementById('s-'+id).classList.add('show');
  document.getElementById('t-'+id).classList.add('active');
  if (id === 'home')     renderGrid();
  if (id === 'list')     renderList();
  if (id === 'stats')    { renderOverall(); renderTagStats(); renderStuStats(); }
  if (id === 'settings') { renderStuManage(); renderTagManage(); renderBackupInfo(); }
}
document.getElementById('t-home').addEventListener('click', function(){ goTab('home'); });
document.getElementById('t-list').addEventListener('click', function(){ goTab('list'); });
document.getElementById('t-stats').addEventListener('click', function(){ goTab('stats'); });
document.getElementById('t-settings').addEventListener('click', function(){ goTab('settings'); });

// ═══════════════════════════════
// GRID
// ═══════════════════════════════
function renderGrid() {
  var grid = document.getElementById('sgrid');
  var today = new Date().toISOString().slice(0,10);
  var todayCnt = 0;
  grid.innerHTML = '';
  students.forEach(function(s) {
    var recs = records.filter(function(r){ return r.stu === s.name; });
    var hasPos = recs.some(function(r){ return r.mt === 'pos'; });
    var hasNeg = recs.some(function(r){ return r.mt === 'neg'; });
    if (recs.filter(function(r){ return r.ts.slice(0,10)===today; }).length) todayCnt++;

    var card = document.createElement('div');
    card.className = 'scard' + (hasNeg?' hasneg':hasPos?' haspos':'');

    var no = document.createElement('div'); no.className='sno'; no.textContent=s.num;
    var dot = document.createElement('div'); dot.className='sdot';
    var nm = document.createElement('div'); nm.className='sname'; nm.textContent=s.name;
    var cnt = document.createElement('div'); cnt.className='scnt'; cnt.textContent=recs.length?recs.length+'筆':'—';

    card.appendChild(no); card.appendChild(dot); card.appendChild(nm); card.appendChild(cnt);
    card.addEventListener('click', (function(sn, num){ return function(){ openModal(sn, num); }; })(s.name, s.num));
    grid.appendChild(card);
  });
  document.getElementById('todaycnt').textContent = '今日已記錄 '+todayCnt+' 人';
}

// ═══════════════════════════════
// MODAL
// ═══════════════════════════════
var curStu = null;
var selTags = [];

function openModal(name, num) {
  curStu = name; selTags = [];
  document.getElementById('mname').textContent = name;
  document.getElementById('mno').textContent = '座號 ' + num;
  document.getElementById('mnote').value = '';
  var now = new Date();
  function p(x){ return String(x).padStart(2,'0'); }
  var dval = now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+'T'+p(now.getHours())+':'+p(now.getMinutes());
  document.getElementById('mdate').value = dval;
  document.getElementById('mwd').textContent = '週' + WD[now.getDay()];
  renderModalTags();
  renderModalHistory(name);

function closeModal() {

}

document.getElementById('mdate').addEventListener('input', function() {

function renderModalTags() {
  var wrap = document.getElementById('mtags');
  wrap.innerHTML = '';
  tags.forEach(function(t) {
    var el = document.createElement('div');
    el.className = 'tag ' + t.type + (selTags.indexOf(t.id)>=0?' sel':'');
    el.textContent = t.name;
    el.addEventListener('click', (function(tid){ return function() {

document.getElementById('btnSave').addEventListener('click', function() {

  var note = document.getElementById('mnote').value.trim();
  var dv = document.getElementById('mdate').value;
  var dt = dv ? new Date(dv) : new Date();
  var mt = 'neu';
  selTags.forEach(function(id) {
    var t = tags.find(function(x){ return x.id===id; });
    if (t && t.type==='neg') mt='neg';
    else if (t && t.type==='pos' && mt!=='neg') mt='pos';
  });
  records.unshift({
    id: 'r'+Date.now(),
    stu: curStu, tags: selTags.slice(),
    note: note, ts: dt.toISOString(),
    mt: mt, wd: WD[dt.getDay()]
  });

  closeModal();

});

function fillSelects() {

      el.appendChild(op);
    });

function renderList() {
  var fs = document.getElementById('fstu').value;
  var ft = document.getElementById('ftype').value;
  var recs = records.filter(function(r){ return (!fs||r.stu===fs)&&(!ft||r.mt===ft); });
  var el = document.getElementById('rlist');
  if (!recs.length) { el.innerHTML='<div class="empty"><div class="emptyicon">📭</div>暫無記錄</div>'; return; }
  var groups = {};
  recs.forEach(function(r){ var d=r.ts.slice(0,10); if(!groups[d]) groups[d]=[]; groups[d].push(r); });
  var dates = Object.keys(groups).sort(function(a,b){ return a<b?1:-1; });
  el.innerHTML = '';
  dates.forEach(function(date) {
    var lbl = document.createElement('div'); lbl.className='dgroup';
    var d = new Date(date+'T00:00:00');
    var now = new Date(); now.setHours(0,0,0,0);
    var diff = Math.round((now-d)/86400000);
    var wd = '週'+WD[d.getDay()];
    lbl.textContent = diff===0?'今天 · '+wd : diff===1?'昨天 · '+wd : d.toLocaleDateString('zh-TW',{month:'long',day:'numeric'})+' · '+wd;
    el.appendChild(lbl);
    groups[date].forEach(function(r){ el.appendChild(makeRecCard(r)); });
  });
}

function makeRecCard(r) {
  var div = document.createElement('div'); div.className='rcard '+r.mt;
  div.style.cursor = 'pointer';

  // Long press to edit
  var pressTimer = null;
  div.addEventListener('touchstart', (function(rid){ return function(){
    pressTimer = setTimeout(function(){ openEditModal(rid); }, 600);
  }; })(r.id));
  div.addEventListener('touchend', function(){ clearTimeout(pressTimer); });
  div.addEventListener('touchmove', function(){ clearTimeout(pressTimer); });

  var del = document.createElement('button'); del.className='rdel'; del.textContent='✕';
  del.addEventListener('click', (function(rid){ return function(e){
    e.stopPropagation();
    records = records.filter(function(x){ return x.id!==rid; });
    saveData('edu_records', records);
    renderList(); renderGrid(); showToast('已刪除');
  }; })(r.id));

  var meta = document.createElement('div'); meta.className='rmeta';
  var nm = document.createElement('div'); nm.className='rname'; nm.textContent=r.stu;
  var tm = document.createElement('div'); tm.className='rtime';
  var d = new Date(r.ts);
  tm.textContent = d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'\n週'+(r.wd||WD[d.getDay()]);
  meta.appendChild(nm); meta.appendChild(tm);

  var tw = document.createElement('div'); tw.className='rtags';
  r.tags.forEach(function(tid) {
    var t = tags.find(function(x){ return x.id===tid; }); if(!t) return;
    var sp = document.createElement('span'); sp.className='rtag '+t.type; sp.textContent=t.name;
    tw.appendChild(sp);
  });

  div.appendChild(del); div.appendChild(meta); div.appendChild(tw);
  if (r.note) { var nt=document.createElement('div'); nt.className='rnote'; nt.textContent=r.note; div.appendChild(nt); }

  // Show edit timestamp if edited
  if (r.editedAt) {
    var ed = new Date(r.editedAt);
    var etxt = document.createElement('div');
    etxt.style.cssText = 'font-size:10px;color:#bbb;margin-top:5px;font-family:"Space Mono",monospace;';
    etxt.textContent = '✏️ 修改於 ' + ed.toLocaleDateString('zh-TW') + ' 週'+(r.editedWd||WD[ed.getDay()])+' ' + ed.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    div.appendChild(etxt);
  }

  // Long press hint
  var hint = document.createElement('div');
  hint.style.cssText = 'font-size:10px;color:#ddd;margin-top:3px;text-align:right;';
  hint.textContent = '長按修改';
  div.appendChild(hint);

  return div;
}

function renderOverall() {
  var tot=records.length, pos=0, neg=0, neu=0, stus={};
  records.forEach(function(r){ if(r.mt==='pos')pos++; else if(r.mt==='neg')neg++; else neu++; stus[r.stu]=1; });
  var el=document.getElementById('ovStats'); el.innerHTML='';
  function addRow(label,val,cls,pct,color){
    var row=document.createElement('div'); row.className='statrow';
    var inner=document.createElement('div'); inner.style.flex='1';
    var top=document.createElement('div'); top.style.cssText='display:flex;justify-content:space-between;';
    var l=document.createElement('span'); l.textContent=label;
    var v=document.createElement('span'); v.className='statval '+cls; v.textContent=val;
    top.appendChild(l); top.appendChild(v); inner.appendChild(top);
    if(color){ var bw=document.createElement('div'); bw.className='barwrap'; var b=document.createElement('div'); b.className='bar'; b.style.background=color; b.style.width=(tot?pct/tot*100:0)+'%'; bw.appendChild(b); inner.appendChild(bw); }
    row.appendChild(inner); el.appendChild(row);
  }
  addRow('總記錄數', tot, ''); addRow('✅ 正向', pos,'g',pos,'var(--green)'); addRow('⚠️ 負向', neg,'r',neg,'var(--red)'); addRow('📌 中性', neu,'b',neu,'var(--blue)');
  addRow('涵蓋學生', Object.keys(stus).length+' 人', '');
}

document.getElementById('ststu').addEventListener('change', renderStuStats);
function renderStuStats() {
  var s=document.getElementById('ststu').value;
  var el=document.getElementById('stStats'); el.innerHTML='';
  if(!s) return;
  var recs=records.filter(function(r){return r.stu===s;});
  if(!recs.length){el.innerHTML='<div style="color:#ccc;font-size:13px;padding:8px 0;">尚無記錄</div>';return;}
  var pos=0,neg=0,neu=0,tc={};
  recs.forEach(function(r){if(r.mt==='pos')pos++;else if(r.mt==='neg')neg++;else neu++; r.tags.forEach(function(id){tc[id]=(tc[id]||0)+1;});});
  [['總記錄',recs.length,''],['✅ 正向',pos,'g'],['⚠️ 負向',neg,'r'],['📌 中性',neu,'b']].forEach(function(rv){
    var row=document.createElement('div'); row.className='statrow';
    var a=document.createElement('span'); a.textContent=rv[0];
    var b=document.createElement('span'); b.className='statval '+rv[2]; b.textContent=rv[1];
    row.appendChild(a); row.appendChild(b); el.appendChild(row);
  });
  Object.entries(tc).sort(function(a,b){return b[1]-a[1];}).slice(0,5).forEach(function(kv){
    var t=tags.find(function(x){return x.id===kv[0];}); if(!t)return;
    var row=document.createElement('div'); row.className='statrow';
    var a=document.createElement('span'); a.className='rtag '+t.type; a.textContent=t.name;
    var b=document.createElement('span'); b.className='statval'; b.style.fontSize='13px'; b.textContent=kv[1]+'次';
    row.appendChild(a); row.appendChild(b); el.appendChild(row);
  });
}

function renderTagStats() {
  var tc={};
  records.forEach(function(r){r.tags.forEach(function(id){tc[id]=(tc[id]||0)+1;});});
  var sorted=Object.entries(tc).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  var el=document.getElementById('tagStats'); el.innerHTML='';
  if(!sorted.length){el.innerHTML='<div class="empty"><div class="emptyicon">📊</div>尚無資料</div>';return;}
  var max=sorted[0][1];
  sorted.forEach(function(kv){
    var t=tags.find(function(x){return x.id===kv[0];}); if(!t)return;
    var wrap=document.createElement('div'); wrap.style.marginBottom='8px';
    var top=document.createElement('div'); top.style.cssText='display:flex;justify-content:space-between;margin-bottom:3px;';
    var a=document.createElement('span'); a.className='rtag '+t.type; a.textContent=t.name;
    var b=document.createElement('span'); b.style.cssText='font-family:"Space Mono",monospace;font-size:12px;'; b.textContent=kv[1];
    top.appendChild(a); top.appendChild(b);
    var bw=document.createElement('div'); bw.className='barwrap';
    var bar=document.createElement('div'); bar.className='bar';
    bar.style.background=t.type==='pos'?'var(--green)':t.type==='neg'?'var(--red)':'var(--blue)';
    bar.style.width=(kv[1]/max*100)+'%'; bw.appendChild(bar);
    wrap.appendChild(top); wrap.appendChild(bw); el.appendChild(wrap);
  });
}

document.getElementById('btnExcel').addEventListener('click', function(){
  if(!records.length){ showToast('沒有資料可匯出'); return; }
  var BOM = '\uFEFF'; // UTF-8 BOM for Excel to read Chinese correctly
  var rows = [['日期','星期','時間','學生','行為標籤','類型','備註']];
  records.forEach(function(r){
    var d = new Date(r.ts);
    var dateStr = d.toLocaleDateString('zh-TW');
    var wd = '週'+(r.wd||WD[d.getDay()]);
    var timeStr = d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    var tagNames = r.tags.map(function(id){ var t=tags.find(function(x){return x.id===id;}); return t?t.name:''; }).filter(Boolean).join('、');
    var typeLabel = r.mt==='pos'?'正向':r.mt==='neg'?'負向':'中性';
    rows.push([dateStr, wd, timeStr, r.stu, tagNames, typeLabel, r.note||'']);
  });
  var csv = BOM + rows.map(function(row){
    return row.map(function(cell){
      var s = String(cell).replace(/"/g,'""');
      return '"'+s+'"';
    }).join(',');
  }).join('\n');
  var now = new Date();
  function p(x){return String(x).padStart(2,'0');}
  var fname = '學生記錄_'+now.getFullYear()+p(now.getMonth()+1)+p(now.getDate())+'.csv';
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✅ CSV 已下載（可用 Excel 開啟）');
});

var editRecId = null;
var editSelTags = [];

function openEditModal(rid) {
  var r = records.find(function(x){ return x.id === rid; });
  if (!r) return;
  editRecId = rid;
  editSelTags = r.tags.slice();
  document.getElementById('editName').textContent = r.stu;
  // find seat number
  var s = students.find(function(x){ return x.name === r.stu; });
  document.getElementById('editNo').textContent = s ? '座號 ' + s.num : '';
  document.getElementById('editNote').value = r.note || '';
  // set date
  var d = new Date(r.ts);
  function p(x){ return String(x).padStart(2,'0'); }
  document.getElementById('editDate').value = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
  document.getElementById('editWd').textContent = '週' + WD[d.getDay()];
  renderEditTags();
  document.getElementById('editOverlay').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('show');
  editRecId = null; editSelTags = [];
}

document.getElementById('editOverlay').addEventListener('click', function(e){ if(e.target===this) closeEditModal(); });
document.getElementById('btnEditCancel').addEventListener('click', closeEditModal);

document.getElementById('editDate').addEventListener('input', function(){
  var v = this.value;
  if (!v) { document.getElementById('editWd').textContent=''; return; }
  document.getElementById('editWd').textContent = '週' + WD[new Date(v).getDay()];
});

function renderEditTags() {
  var wrap = document.getElementById('editTags');
  wrap.innerHTML = '';
  tags.forEach(function(t) {
    var el = document.createElement('div');
    el.className = 'tag ' + t.type + (editSelTags.indexOf(t.id)>=0?' sel':'');
    el.textContent = t.name;
    el.addEventListener('click', (function(tid){ return function(){
      var i = editSelTags.indexOf(tid);
      if (i>=0) editSelTags.splice(i,1); else editSelTags.push(tid);
      renderEditTags();
    }; })(t.id));
    wrap.appendChild(el);
  });
}

document.getElementById('btnEditSave').addEventListener('click', function(){
  if (!editRecId) return;
  if (!editSelTags.length) { showToast('請選擇至少一個行為標籤'); return; }
  var idx = records.findIndex(function(x){ return x.id === editRecId; });
  if (idx === -1) return;
  var r = records[idx];
  var note = document.getElementById('editNote').value.trim();
  var dv = document.getElementById('editDate').value;
  var dt = dv ? new Date(dv) : new Date(r.ts);
  var mt = 'neu';
  editSelTags.forEach(function(id){
    var t = tags.find(function(x){ return x.id===id; });
    if (t && t.type==='neg') mt='neg';
    else if (t && t.type==='pos' && mt!=='neg') mt='pos';
  });
  var editedAt = new Date();
  records[idx] = {
    id: r.id, stu: r.stu,
    tags: editSelTags.slice(),
    note: note,
    ts: dt.toISOString(),
    mt: mt,
    wd: WD[dt.getDay()],
    editedAt: editedAt.toISOString(),
    editedWd: WD[editedAt.getDay()]
  };
  saveData('edu_records', records);
  closeEditModal();
  renderList();
  showToast('✅ 已修改記錄');
});

}
function closeBatchModal() {
  document.getElementById('batchOverlay').classList.remove('show');
  batchSelTags = []; batchParsedStudents = [];
}
document.getElementById('batchOverlay').addEventListener('click', function(e){ if(e.target===this) closeBatchModal(); });
document.getElementById('btnBatchCancel').addEventListener('click', closeBatchModal);
document.getElementById('btnBatch').addEventListener('click', openBatchModal);

document.getElementById('batchDate').addEventListener('input', function(){
  var v = this.value;
  document.getElementById('batchWd').textContent = v ? '週'+WD[new Date(v).getDay()] : '';
});

// Parse input text to find student numbers
document.getElementById('batchInput').addEventListener('input', function(){
  var text = this.value;
  // Extract all numbers from the text
  var nums = [];
  var matches = text.match(/\d+/g);
  if (matches) {
    matches.forEach(function(m){
      var n = parseInt(m);
      nums.push(n);
    });
  }
  // Find students matching those numbers
  batchParsedStudents = [];
  nums.forEach(function(n){
    var s = students.find(function(x){ return x.num === n; });
    if (s && batchParsedStudents.indexOf(s.name) === -1) {
      batchParsedStudents.push(s.name);
    }
  });
  renderBatchParsed();
});

function renderBatchParsed() {
  var el = document.getElementById('batchParsed');
  el.innerHTML = '';
  if (!batchParsedStudents.length) {
    el.innerHTML = '<span style="color:#ccc;font-size:12px;">尚未偵測到學生座號</span>';
    return;
  }
  batchParsedStudents.forEach(function(name){
    var s = students.find(function(x){ return x.name===name; });
    var chip = document.createElement('div');
    chip.style.cssText = 'background:var(--ink);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;';
    chip.textContent = (s?s.num+'號 ':'') + name;
    // tap to remove
    var x = document.createElement('span');
    x.textContent = '✕'; x.style.cssText='cursor:pointer;opacity:0.6;font-size:11px;';
    x.addEventListener('click', (function(n){ return function(){
      batchParsedStudents = batchParsedStudents.filter(function(x){ return x!==n; });
      renderBatchParsed();
    }; })(name));
    chip.appendChild(x);
    el.appendChild(chip);
  });
}

function renderBatchTags() {
  var wrap = document.getElementById('batchTags');
  wrap.innerHTML = '';
  tags.forEach(function(t){
    var el = document.createElement('div');
    el.className = 'tag '+t.type+(batchSelTags.indexOf(t.id)>=0?' sel':'');
    el.textContent = t.name;
    el.addEventListener('click', (function(tid){ return function(){
      var i = batchSelTags.indexOf(tid);
      if(i>=0) batchSelTags.splice(i,1); else batchSelTags.push(tid);
      renderBatchTags();
    }; })(t.id));
    wrap.appendChild(el);
  });
}

document.getElementById('btnBatchSave').addEventListener('click', function(){
  if (!batchParsedStudents.length) { showToast('請輸入包含座號的描述'); return; }
  if (!batchSelTags.length) { showToast('請選擇至少一個行為標籤'); return; }
  var note = document.getElementById('batchInput').value.trim();
  var dv = document.getElementById('batchDate').value;
  var dt = dv ? new Date(dv) : new Date();
  var mt = 'neu';
  batchSelTags.forEach(function(id){
    var t = tags.find(function(x){ return x.id===id; });
    if(t && t.type==='neg') mt='neg';
    else if(t && t.type==='pos' && mt!=='neg') mt='pos';
  });
  var now = Date.now();
  batchParsedStudents.forEach(function(name, i){
    records.unshift({
      id: 'r'+(now+i),
      stu: name,
      tags: batchSelTags.slice(),
      note: note,
      ts: dt.toISOString(),
      mt: mt,
      wd: WD[dt.getDay()]
    });
  });
  saveData('edu_records', records);
  closeBatchModal();
  renderGrid();
  showToast('✅ 已為 '+batchParsedStudents.length+' 位學生建立記錄');
});


// ═══════════════════════════════
// STUDENT HISTORY IN MODAL
// ═══════════════════════════════
function renderModalHistory(name) {
  var el = document.getElementById('mHistory');
  var recs = records.filter(function(r){ return r.stu === name; });
  if (!recs.length) {
    el.innerHTML = '';
    return;
  }
  // Sort by date desc
  recs = recs.slice().sort(function(a,b){ return a.ts < b.ts ? 1 : -1; });

  var wrap = document.createElement('div');

  var title = document.createElement('div');
  title.style.cssText = 'font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#bbb;margin-bottom:10px;padding-top:4px;border-top:1px solid var(--border);';
  title.textContent = '📋 歷史記錄（' + recs.length + ' 筆）';
  wrap.appendChild(title);

  recs.forEach(function(r) {
    var card = document.createElement('div');
    card.style.cssText = 'background:#f8f5ef;border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:8px;';
    if (r.mt==='pos') card.style.borderLeftColor = 'var(--green)';
    else if (r.mt==='neg') card.style.borderLeftColor = 'var(--red)';
    else card.style.borderLeftColor = 'var(--blue)';

    var d = new Date(r.ts);
    var meta = document.createElement('div');
    meta.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;';
    var dateEl = document.createElement('span');
    dateEl.style.cssText = 'font-family:"Space Mono",monospace;font-size:10px;color:#aaa;';
    dateEl.textContent = d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}) + ' 週'+(r.wd||WD[d.getDay()])+' '+d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    meta.appendChild(dateEl);
    var metaRight = document.createElement('div');
    metaRight.style.cssText = 'display:flex;align-items:center;gap:6px;';
    if (r.editedAt) {
      var edbadge = document.createElement('span');
      edbadge.style.cssText = 'font-size:9px;color:#ccc;font-family:"Space Mono",monospace;';
      edbadge.textContent = '✏️已修改';
      metaRight.appendChild(edbadge);
    }
    var editBtn = document.createElement('button');
    editBtn.textContent = '修改';
    editBtn.style.cssText = 'font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;border:none;background:var(--ink);color:#fff;cursor:pointer;font-family:"Noto Sans TC",sans-serif;';
    editBtn.addEventListener('click', (function(rid){ return function(e){
      e.stopPropagation();
      closeModal();
      setTimeout(function(){ openEditModal(rid); }, 200);
    }; })(r.id));
    metaRight.appendChild(editBtn);
    meta.appendChild(metaRight);
    card.appendChild(meta);

    var tw = document.createElement('div');
    tw.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;';
    r.tags.forEach(function(tid){
      var t = tags.find(function(x){ return x.id===tid; }); if(!t)return;
      var sp = document.createElement('span'); sp.className='rtag '+t.type; sp.textContent=t.name;
      tw.appendChild(sp);
    });
    card.appendChild(tw);

    if (r.note) {
      var nt = document.createElement('div');
      nt.style.cssText = 'font-size:12px;color:#777;line-height:1.5;';
      nt.textContent = r.note;
      card.appendChild(nt);
    }

    // Long press to edit this record
    var pressTimer = null;
    card.addEventListener('touchstart', (function(rid){ return function(){
      pressTimer = setTimeout(function(){
        closeModal();
        setTimeout(function(){ openEditModal(rid); }, 200);
      }, 600);
    }; })(r.id));
    card.addEventListener('touchend', function(){ clearTimeout(pressTimer); });
    card.addEventListener('touchmove', function(){ clearTimeout(pressTimer); });

    wrap.appendChild(card);
  });

  el.innerHTML = '';
  el.appendChild(wrap);
}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
fillSelects();
renderGrid();
renderStuManage();
renderTagManage();
renderBackupInfo();
</script>
